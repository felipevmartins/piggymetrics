eureka:
  client:
    enabled: false

spring:
  cloud:
    config:
      enabled: false
    bus:
      enabled: false

# Explicit fixture when Config Server is disabled; no production credentials.
security:
  oauth2:
    client:
      clientId: notification-service
      clientSecret: contract-secret
      accessTokenUri: http://127.0.0.1:1/oauth/token
      grant-type: client_credentials
      scope: server
    resource:
      user-info-uri: http://127.0.0.1:1/users/current
