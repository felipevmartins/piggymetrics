remind:
  cron: 0 0 0 * * *
  email:
    text: "Hey, {0}! We''ve missed you here on PiggyMetrics. It''s time to check your budget statistics.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics reminder

backup:
  cron: 0 0 12 * * *
  email:
    text: "Howdy, {0}. Your account backup is ready.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics account backup
    attachment: backup.json

spring:
  mail:
    host: smtp.gmail.com
    port: 465
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true

---
eureka:
  client:
    enabled: false

spring:
  cloud:
    config:
      enabled: false
    bus:
      enabled: false

# Explicit fixture when Config Server is disabled; no production credentials.
security:
  oauth2:
    client:
      clientId: notification-service
      clientSecret: contract-secret
      accessTokenUri: http://127.0.0.1:1/oauth2/token
      grant-type: client_credentials
      scope: server
    resource:
      introspection-uri: http://127.0.0.1:1/oauth2/introspect
      client-id: notification-service
      client-secret: contract-secret
